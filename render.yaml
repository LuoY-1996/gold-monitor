# Render Blueprint — free deployment
# Push to GitHub, connect to Render, done.
# Free tier: 512MB RAM, auto-sleeps after 15min idle (wakes on next request)

services:
  - type: web
    name: gold-monitor
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build && mkdir -p ../backend/static && cp -r dist/* ../backend/static/
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: FETCH_INTERVAL_MINUTES
        value: "30"
      - key: PYTHON_VERSION
        value: "3.11"
